{% extends 'base.html'%}
{% load static %}
{% block content %}
<style>
   .form-control
   {
   margin-bottom:8px;
   }
</style>
<div class="row">
    <div class="h2 text-center">Contact <b style="color:#365ff4;">Us <i class="fa fa-phone"></i></b></div>
    <div class="col-sm-1"></div>
    <div class="col-sm-10 bg-light">
        <div class="row">
            <div class="col-sm-5 p-5">

                <form method="post" autocomplete="off">
                    {% csrf_token %}<!-- cross site reforgery -->
                    {% if S %}
                <div class="alert alert-success">
                   Thanks for enquiry...
                </div>
                    {% endif%}

                Name <input type="text" placeholder="Enter Your Name.." required class="form-control" name="name"/>
                Mobile No <input type="text" placeholder="Enter Your Mobile No.." required class="form-control" name="mobile"/>
                Email <input type="email" placeholder="Enter Your Email.." required class="form-control" name="email"/>
                Massage<textarea class="form-control" name="msg" placeholder="Enter Your Message.." required></textarea>
                <input type="submit" value="Save" class="btn btn-primary"/>
                </form>
            </div>
            <div class="col-sm-7 p-5">
               <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3562.245916244009!2d83.37654231504186!3d26.76842998319007!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399145a8c0943555%3A0x52cc9b6a7198d8e2!2sFavCart%20India%20Pvt.%20Ltd.!5e0!3m2!1sen!2sin!4v1634297929299!5m2!1sen!2sin" width="700" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>
    <div class="col-sm-1"></div>
</div>
{% endblock %}
